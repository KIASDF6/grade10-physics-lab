<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الفيزياء التفاعلي - الصف العاشر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f6;--pn:#fff;--tx:#12303d;--mu:#5b7380;--ac:#0b7a75;--ac2:#e0574a;--gr:#d3dfe5;--hd:#0f3b4a;--hl:#e3f3f1}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b21;--pn:#16272f;--tx:#e6f1f4;--mu:#93aab5;--ac:#3cc4bb;--ac2:#ff8a7c;--gr:#2b4450;--hd:#0a2a35;--hl:#17363a}}
:root[data-theme="dark"]{--bg:#0e1b21;--pn:#16272f;--tx:#e6f1f4;--mu:#93aab5;--ac:#3cc4bb;--ac2:#ff8a7c;--gr:#2b4450;--hd:#0a2a35;--hl:#17363a}
html,body{height:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:20px;margin:0}
header{background:var(--hd);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:28px;font-weight:800;margin:0}header small{opacity:.8;font-size:18px}
.nb{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;min-height:48px}
.nb:hover{background:rgba(255,255,255,.26)}
main{max-width:1280px;margin:0 auto;padding:20px}
.ch{margin:26px 0 10px;font-size:26px;font-weight:800;border-right:6px solid var(--ac);padding-right:12px}
.card{background:var(--pn);border:1px solid var(--gr);border-radius:14px;padding:18px;text-align:right;cursor:pointer;font:inherit;color:inherit;min-height:110px;width:100%}
.card:hover{border-color:var(--ac);background:var(--hl)}
.card b{display:block;font-size:22px;margin-bottom:4px}.card span{color:var(--mu);font-size:17px}
.panel{background:var(--pn);border:1px solid var(--gr);border-radius:14px;padding:18px}
.goal{background:var(--hl);border-radius:12px;padding:12px 16px;margin:10px 0 16px}
.ctl{margin-bottom:18px}.ctl label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.ctl output{color:var(--ac);direction:ltr;font-weight:800}
input[type=range]{width:100%;height:36px;accent-color:var(--ac)}
select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--gr);background:var(--pn);color:var(--tx)}
canvas{width:100%;height:auto;background:var(--pn);border:1px solid var(--gr);border-radius:12px;display:block}
.res{margin-top:14px;font-size:22px;line-height:1.9}
.eq{direction:ltr;text-align:center;background:var(--bg);border-radius:10px;padding:6px 12px;margin:6px 0;font-weight:700;font-size:23px}
.ok{color:var(--ac);font-weight:800}.hot{color:var(--ac2);font-weight:800}
details{background:var(--bg);border-radius:10px;padding:10px 14px;margin:8px 0}summary{cursor:pointer;font-weight:700}
@media (max-width:640px){body{font-size:18px}header h1{font-size:22px}}
:root{--bg:#f2f5fb;--pn:#fff;--tx:#0f1f3d;--mu:#566891;--ac:#1f4fd8;--ac2:#f26b21;--gr:#d9e1f2;--hd:#0b1d4a;--hl:#e6edfc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1228;--pn:#121c3a;--tx:#e8eeff;--mu:#9aa9cf;--ac:#7aa0ff;--ac2:#ff9150;--gr:#243259;--hd:#070e24;--hl:#18264d}}
:root[data-theme="dark"]{--bg:#0a1228;--pn:#121c3a;--tx:#e8eeff;--mu:#9aa9cf;--ac:#7aa0ff;--ac2:#ff9150;--gr:#243259;--hd:#070e24;--hl:#18264d}
body{background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:36px 36px}
header{background:linear-gradient(120deg,var(--hd),#173a9c);border-bottom:5px solid var(--ac2);padding:20px 28px}
header h1{font-size:34px}
.hero{display:flex;gap:24px;align-items:center;background:var(--pn);border:2px solid var(--ac);border-radius:22px;padding:18px 26px;color:var(--ac);margin-bottom:6px}
.hero h2{color:var(--tx);font-size:28px;margin:0 0 4px;font-weight:800}.hero p{margin:0;color:var(--mu)}
.ch{border-right-color:var(--ac2)}
.card{border-radius:20px;border:2px solid var(--gr);transition:transform .15s,box-shadow .15s;display:block}
.card:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 14px 26px -14px var(--ac)}
.card em{font-style:normal;font-size:40px;display:block;margin-bottom:6px}
.panel{border-radius:18px;box-shadow:0 8px 24px -16px var(--ac)}
.res{border-right:6px solid var(--ac2)}
.eq{background:var(--hl);border:1px solid var(--gr)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;min-height:50px;margin:4px}
.btn.alt{background:var(--hl);color:var(--ac);border:2px solid var(--ac)}
.btn.good{background:#15803d}.btn.bad{background:#c62828}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--gr)}
.inp{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--gr);width:160px;background:var(--pn);color:var(--tx);direction:ltr}
.tb{width:100%;border-collapse:collapse;direction:ltr;text-align:center;font-size:20px}.tb th,.tb td{border:1px solid var(--gr);padding:6px}.tb th{background:var(--hl)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.logo{width:76px;height:76px;border-radius:18px;background:#fff;display:grid;place-items:center;cursor:pointer;overflow:hidden;text-align:center;color:#0b1d4a;font-size:30px;line-height:1.1;flex:none}
.logo img{max-width:100%;max-height:100%}.logo small{display:block;font-size:12px}
.hb{display:flex;gap:16px;align-items:center}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.sh{background:var(--pn);border:1px solid var(--gr);border-radius:14px;padding:12px 16px}.sh ol{padding-right:24px;margin:4px 0}
#ex,#qz{margin-top:14px}#ex h3{color:var(--ac);font-weight:800;margin:6px 0}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:46px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:var(--gr)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--gr)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:var(--ac);border:4px solid var(--pn);box-shadow:0 2px 8px #0005}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--ac);border:4px solid var(--pn)}
@media (min-width:1500px){body{font-size:26px}.btn{min-height:64px;font-size:24px}header h1{font-size:42px}.logo{width:96px;height:96px}}
@media (max-width:640px){header h1{font-size:21px}.hero svg{display:none}.logo{width:56px;height:56px}.btn{width:100%}}
#rp{display:none}
@media print{body>*:not(#rp){display:none!important}#rp{display:block;color:#000;direction:rtl;font-size:16px}body{background:#fff!important}#rp .rh{display:flex;gap:16px;align-items:center;border-bottom:3px solid #1f4fd8;margin-bottom:10px}#rp img.lo{height:80px}#rp .btn{display:none}}
.logo{width:auto;height:84px;padding:4px 12px;pointer-events:none}.logo img{height:100%;width:auto;max-width:none}@media (min-width:1500px){.logo{height:112px}}@media (max-width:640px){.logo{height:54px;padding:3px 8px}}
</style>
</head>
<body>
<header>
 <div class="hb"><span hidden><img id="sl" alt="" hidden><span id="lp"></span><input id="lf" type="file"></span><div><h1>مختبر الفيزياء التفاعلي - الصف العاشر</h1><small>مدرسة النجاة الثانوية - السالمية - بنين | إعداد الأستاذ: محمد حجاب</small></div></div>
 <div class="flex gap-2"><button class="nb" onclick="home()">🏠 الرئيسية</button><button class="nb" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">⛶ ملء الشاشة</button></div>
</header>
<main>
 <section id="home"></section>
 <section id="lab" hidden>
  <button class="nb" style="background:var(--ac)" onclick="home()">→ رجوع إلى الدروس</button>
  <h2 id="lt" class="ch" style="margin-top:14px"></h2>
  <div class="goal" id="lg"></div><div id="sheet"></div><div class="tools"><button class="btn" onclick="startLab()">▶ بدء التجربة</button><button class="btn alt" onclick="resetLab()">↺ إعادة ضبط</button><button class="btn alt" onclick="toggleEx()">💡 عرض التفسير العلمي</button><button class="btn alt" onclick="report()">🖨️ طباعة / PDF</button></div>
  <div class="grid gap-4 lg:grid-cols-3">
   <div class="panel" id="ctls"></div>
   <div class="lg:col-span-2"><canvas id="cv" width="900" height="460"></canvas><div class="panel res" id="res"></div><div id="ex" class="panel" hidden></div><div id="qz" class="panel"></div></div>
  </div>
 </section>
</main>
<div id="rp"></div>
<script>
const $=s=>document.querySelector(s),f=n=>String(+(+n).toFixed(2)),R=Math.PI/180,g9=9.8;
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const PR=[['جيجا (G)',9],['ميجا (M)',6],['كيلو (k)',3],['الوحدة الأساسية',0],['مللي (m)',-3],['ميكرو (μ)',-6],['نانو (n)',-9]];
const CH=[
 ['الوحدة الأولى - الفصل الأول: علم الفيزياء',['disc','units']],
 ['الفصل الثاني: الحركة في بعد واحد',['dist','eqs','fall']],
 ['الفصل الثالث: الحركة في بعدين',['resolve','add','prod','proj']]];
function ax(G,x0,x1,y0,y1,xl,yl){const c=G.c,p=56;c.clearRect(0,0,G.w,G.h);c.font='16px Tajawal,sans-serif';c.lineWidth=1;
 const fx=x=>p+(x-x0)/(x1-x0)*(G.w-p-24),fy=y=>G.h-p-(y-y0)/(y1-y0)*(G.h-p-24);
 for(let i=0;i<=5;i++){const x=x0+(x1-x0)*i/5,y=y0+(y1-y0)*i/5;c.strokeStyle=css('--gr');c.beginPath();c.moveTo(fx(x),fy(y0));c.lineTo(fx(x),fy(y1));c.moveTo(fx(x0),fy(y));c.lineTo(fx(x1),fy(y));c.stroke();
  c.fillStyle=css('--mu');c.textAlign='center';c.fillText(f(x),fx(x),G.h-p+22);c.textAlign='right';c.fillText(f(y),p-6,fy(y)+5)}
 c.fillStyle=css('--tx');c.textAlign='center';c.fillText(xl,G.w/2,G.h-8);c.save();c.translate(14,G.h/2);c.rotate(-Math.PI/2);c.fillText(yl,0,0);c.restore();return{fx,fy}}
function ln(G,A,pts,col,dash,w){const c=G.c;c.strokeStyle=col;c.lineWidth=w||3;c.setLineDash(dash||[]);c.beginPath();pts.forEach((p,i)=>i?c.lineTo(A.fx(p[0]),A.fy(p[1])):c.moveTo(A.fx(p[0]),A.fy(p[1])));c.stroke();c.setLineDash([])}
function arr(G,x0,y0,x1,y1,col,t,dash){const c=G.c,a=Math.atan2(y1-y0,x1-x0);c.strokeStyle=c.fillStyle=col;c.lineWidth=4;c.setLineDash(dash||[]);c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();c.setLineDash([]);
 if(!dash){c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-14*Math.cos(a-.4),y1-14*Math.sin(a-.4));c.lineTo(x1-14*Math.cos(a+.4),y1-14*Math.sin(a+.4));c.fill()}
 if(t){c.font='bold 20px Tajawal,sans-serif';c.textAlign='center';c.fillText(t,(x0+x1)/2+10,(y0+y1)/2-10)}}
function vcanvas(G,s){const c=G.c;c.clearRect(0,0,G.w,G.h);const O=[G.w/2,G.h/2];c.strokeStyle=css('--gr');c.lineWidth=1;c.beginPath();c.moveTo(0,O[1]);c.lineTo(G.w,O[1]);c.moveTo(O[0],0);c.lineTo(O[0],G.h);c.stroke();return(x,y)=>[O[0]+x*s,O[1]-y*s]}
const M={
disc:{t:'اكتشف بنفسك (1) - (2) - (3)',goal:'تنمية مهارة طرح الأسئلة الفيزيائية وتحديد مجال الفيزياء المناسب.',ctl:[],nc:1,
 run:()=>`<details open><summary>(1) صور الكون وتلسكوب هابل</summary>اطرح أسئلة فيزيائية: كيف تتشكل المجرات؟ ما سبب اختلاف ألوان النجوم؟ كيف تُقاس المسافات الهائلة؟</details>
<details><summary>(2) غروب الشمس مقابل سرعة سيارة في مضمار</summary>وصف الغروب وصف نوعي (جميل، أحمر)، أما سرعة السيارة فوصف كمي دقيق (مقدار ووحدة) تتيحه الفيزياء والرياضيات.</details>
<details><summary>(3) مشاريع مركز الكويت الوطني لأبحاث الفضاء</summary><b>هبوط مسبار</b>: فيزياء كلاسيكية. <b>ثقب أسود</b>: فيزياء حديثة (النسبية). <b>معالج ذكي</b>: فيزياء حديثة (أشباه الموصلات والكم).</details>`},
units:{t:'الكميات الفيزيائية ووحدات النظام الدولي (SI)',goal:'التحويل بين مضاعفات الوحدات باستخدام القوى العشرية.',nc:1,
 ctl:[{k:'v',l:'القيمة',min:1,max:999,step:1,v:250},{k:'a',l:'من',t:'s',o:PR,v:3},{k:'b',l:'إلى',t:'s',o:PR,v:0}],
 run:v=>{const r=v.v*10**(v.a-v.b);return`<div class="eq">${v.v} × 10<sup>${v.a}</sup> ÷ 10<sup>${v.b}</sup> = ${v.v} × 10<sup>${v.a-v.b}</sup></div><p>النتيجة = <span class="ok" dir="ltr">${Number(r.toPrecision(6))}</span> (بالوحدة المختارة).</p><p>الكمية الفيزيائية قابلة للقياس ولها وحدة، مثل الطول والكتلة والزمن، بخلاف الجمال أو الشجاعة.</p>`}},
dist:{t:'الدرس 1-2: المسافة (d) والإزاحة (Δx) والسرعة',goal:'التمييز بين الكمية العددية (المسافة، السرعة العددية) والمتجهة (الإزاحة، السرعة المتجهة).',
 ctl:[{k:'a',l:'نقطة الانعطاف (م)',min:-10,max:10,step:1,v:8},{k:'b',l:'نقطة النهاية (م)',min:-10,max:10,step:1,v:-2},{k:'t',l:'الزمن الكلي (ث)',min:1,max:20,step:1,v:4}],
 draw:(G,v)=>{const c=G.c,X=x=>G.w/2+x*(G.w-80)/24,y=G.h/2;c.clearRect(0,0,G.w,G.h);c.strokeStyle=css('--tx');c.lineWidth=2;c.beginPath();c.moveTo(X(-12),y);c.lineTo(X(12),y);c.stroke();c.fillStyle=css('--mu');c.font='16px Tajawal';c.textAlign='center';for(let i=-10;i<=10;i+=2)c.fillText(i,X(i),y+24);
 c.lineWidth=4;c.strokeStyle=css('--ac');c.beginPath();c.moveTo(X(0),y);c.quadraticCurveTo(X(v.a/2),y-90,X(v.a),y);c.stroke();c.beginPath();c.moveTo(X(v.a),y);c.quadraticCurveTo(X((v.a+v.b)/2),y-90,X(v.b),y);c.stroke();
 arr(G,X(0),y+60,X(v.b),y+60,css('--ac2'),'Δx');c.fillStyle=css('--tx');c.beginPath();c.arc(X(0),y,8,0,7);c.fill()},
 run:v=>{const d=Math.abs(v.a)+Math.abs(v.b-v.a),dx=v.b;return`<div class="eq">d = |${v.a}| + |${v.b}−${v.a}| = <span class="ok">${f(d)} m</span></div><div class="eq">Δx = x₂ − x₁ = <span class="hot">${f(dx)} m</span></div><div class="eq">السرعة العددية = d/t = ${f(d/v.t)} m/s</div><div class="eq">السرعة المتجهة = Δx/t = ${f(dx/v.t)} m/s</div><p>المسافة لا تكون سالبة، أما الإزاحة فتحمل اتجاهًا (إشارتها).</p>`}},
eqs:{t:'الدرس 2-2: معادلات الحركة المتسارعة بانتظام',goal:'حساب السرعة النهائية والإزاحة، وقراءة الرسم (السرعة - الزمن): الميل = التسارع والمساحة = الإزاحة.',
 ctl:[{k:'u',l:'السرعة الابتدائية v₀ (m/s)',min:-10,max:30,step:1,v:5},{k:'a',l:'التسارع a (m/s²)',min:-10,max:10,step:.5,v:2},{k:'t',l:'الزمن t (s)',min:1,max:10,step:.5,v:5}],
 draw:(G,v)=>{const w=v.u+v.a*v.t,lo=Math.min(0,v.u,w)-1,hi=Math.max(0,v.u,w)+1,A=ax(G,0,v.t,lo,hi,'الزمن t (s)','السرعة v (m/s)');ln(G,A,[[0,0],[v.t,0]],css('--mu'),[4,4],1);G.c.fillStyle=css('--ac')+'33';G.c.beginPath();G.c.moveTo(A.fx(0),A.fy(0));G.c.lineTo(A.fx(0),A.fy(v.u));G.c.lineTo(A.fx(v.t),A.fy(w));G.c.lineTo(A.fx(v.t),A.fy(0));G.c.fill();ln(G,A,[[0,v.u],[v.t,w]],css('--ac'))},
 run:v=>{const w=v.u+v.a*v.t,d=v.u*v.t+.5*v.a*v.t*v.t;return`<div class="eq">v = v₀ + a·t = ${f(v.u)} + ${f(v.a)}×${v.t} = <span class="ok">${f(w)} m/s</span></div><div class="eq">Δx = v₀t + ½at² = <span class="ok">${f(d)} m</span></div><div class="eq">v² = v₀² + 2aΔx → ${f(w*w)} = ${f(v.u*v.u+2*v.a*d)} ✔</div><p>ميل الخط = التسارع = <span class="hot">${f(v.a)}</span>، والمساحة المظللة = الإزاحة.</p>`}},
fall:{t:'الدرس 3-2: السقوط الحر وقياس تسارع الجاذبية',goal:'استنتاج g من العلاقة 2h = g·t²، ودراسة القذف الرأسي للأعلى (إهمال مقاومة الهواء).',
 ctl:[{k:'h',l:'الارتفاع الابتدائي h₀ (m)',min:0,max:100,step:1,v:45},{k:'u',l:'سرعة القذف للأعلى v₀ (m/s)',min:0,max:30,step:1,v:0}],
 draw:(G,v)=>{const T=(v.u+Math.sqrt(v.u*v.u+2*g9*v.h))/g9||1,H=v.h+v.u*v.u/(2*g9)||1,A=ax(G,0,T,0,H*1.1,'الزمن t (s)','الارتفاع y (m)'),p=[];for(let i=0;i<=60;i++){const t=T*i/60;p.push([t,Math.max(0,v.h+v.u*t-.5*g9*t*t)])}ln(G,A,p,css('--ac'))},
 run:v=>{const s=Math.sqrt(v.u*v.u+2*g9*v.h),T=(v.u+s)/g9,H=v.h+v.u*v.u/(2*g9);return`<div class="eq">زمن التحليق t = ${f(T)} s</div><div class="eq">أقصى ارتفاع = h₀ + v₀²/2g = <span class="ok">${f(H)} m</span></div><div class="eq">السرعة لحظة الاصطدام = √(v₀²+2gh₀) = <span class="hot">${f(s)} m/s</span></div>${v.u==0&&v.h>0?`<div class="eq">g = 2h/t² = 2×${v.h}/${f(T)}² = <span class="ok">${f(2*v.h/T/T)} m/s²</span></div>`:'<p>اجعل v₀ = 0 لقياس g من السقوط الحر.</p>'}`}},
resolve:{t:'الدرس 2-3: تحليل المتجهات إلى مركبتين',goal:'تفكيك متجه مائل إلى مركبة أفقية Aₓ = A cosθ ومركبة رأسية A_y = A sinθ.',
 ctl:[{k:'A',l:'مقدار المتجه A',min:1,max:20,step:1,v:15},{k:'th',l:'الزاوية θ (°)',min:0,max:360,step:1,v:37}],

tube:['أنبوبة زجاجية، مضخة تفريغ هواء، ريشة، عملة معدنية.',['ضع الريشة والعملة في الأنبوبة وأغلقها بإحكام.','ثبّت الأنبوبة رأسيًا واضغط «بدء التجربة» ولاحظ أيهما يصل أولًا.','فرّغ الأنبوبة بالمضخة (اسحب منزلق الهواء إلى 0%).','أعد الإسقاط وقارن النتيجتين.'],'ΣF = ma ، F = mg ، في السقوط الحر a = g = 9.8 m/s²','بوجود الهواء تصل العملة أولًا، وبعد التفريغ تصل الريشة والعملة معًا.','مقاومة الهواء قوة تعاكس الحركة، وتأثيرها في الريشة كبير مقارنة بوزنها الصغير. وعند غياب الهواء تؤثر الجاذبية وحدها، فيكون تسارع الجسمين g نفسه مهما اختلفت كتلتاهما. (الحركة في المحاكاة مبطّأة للمشاهدة.)'],
gexp:['جهاز السقوط الحر (ساعة إلكترونية، قاعدة، محرر كرات)، كرة معدنية، مسطرة، حاسوب.',['ركّب جهاز السقوط الحر.','سجّل ارتفاع الكرة (Δx).','أسقط الكرة وسجّل الزمن t.','أعد التجربة من ارتفاعات مختلفة وأكمل الجدول.','ارسم 2Δx مقابل t² واحسب ميل الخط.'],'Δx = ½gt² ⇒ 2Δx = g·t² ⇒ g = 2Δx/t²','تقع النقاط تقريبًا على خط مستقيم يمر بالأصل، وميله قريب من 9.8 m/s².','لأن v₀ = 0 تصبح Δx = ½gt²، فالعلاقة بين 2Δx وt² خطية وميلها g. الانحراف البسيط عن 9.8 سببه أخطاء القياس.'],
fall:['محاكاة: ارتفاع ابتدائي h₀ وسرعة قذف رأسية للأعلى v₀ (إهمال مقاومة الهواء).',['اضبط الارتفاع الابتدائي.','اضبط سرعة القذف (صفر = سقوط حر).','لاحظ المنحنى والنتائج.'],'y = h₀ + v₀t − ½gt² ، v = v₀ − gt ، v² = v₀² + 2gh₀ (عند الاصطدام)','يرتفع الجسم ثم ينخفض، وتكون سرعته صفرًا عند أقصى ارتفاع.','تؤثر الجاذبية وحدها فيتغير المتجه سرعة بمعدل ثابت 9.8 m/s² نحو الأسفل: تتناقص السرعة صعودًا وتتزايد هبوطًا، ويبقى التسارع نحو الأسفل حتى عند القمة.'],
proj:['محاكاة: سرعة القذف v₀ وزاوية القذف θ (إهمال مقاومة الهواء، والقذف والسقوط عند المستوى نفسه).',['اضبط v₀ وθ.','قارن المسار بمسار الزاوية المتممة (90°−θ) المتقطع.','جرّب 30° و60° ثم 45°.'],'vₓ = v₀cosθ ، v_y = v₀sinθ ، T = 2v₀sinθ/g ، R = v₀²sin2θ/g ، h = (v₀sinθ)²/2g','تعطي الزاويتان θ و(90°−θ) المدى نفسه، ويكون أكبر مدى عند 45°.','الحركة الأفقية بسرعة ثابتة والرأسية بتسارع g، وهما مستقلتان. المدى يتناسب مع sin2θ، وهذه القيمة تتساوى للزاويتين المتتامتين وتبلغ أعظمها عند 45°.']};

gexp:[['ميل الخط (2Δx مقابل t²) يساوي:',['g','g/2','1/g'],0,'2Δx = g·t².'],['السرعة الابتدائية في السقوط الحر:',['صفر','9.8 m/s','g/2'],0,'يبدأ الجسم من السكون.']],

eqs:[['التسارع يساوي ميل منحنى:',['الإزاحة - الزمن','السرعة - الزمن','المسافة - الزمن'],1,'a = Δv/Δt.']],

function renderInfo(id){const n=INFO[id];$('#sheet').innerHTML=n?`<details open class="sh"><summary>📋 ورقة التجربة: الأدوات والخطوات والقوانين</summary><p><b>الأدوات:</b> ${n[0]}</p><b>الخطوات:</b><ol>${n[1].map(s=>`<li>${s}</li>`).join('')}</ol><p><b>القوانين:</b> <span dir="ltr">${n[2]}</span></p></details>`:'';const e=$('#ex');e.hidden=true;e.innerHTML=n?`<h3>المشاهدة</h3><p>${n[3]}</p><h3>التفسير العلمي</h3><p>${n[4]}</p>`:'<p>هذا نشاط تدريبي، والحل التفصيلي يظهر بعد الإجابة.</p>'}
function renderQ(id){const Q=QZ[id],q=$('#qz');q.hidden=!Q;if(!Q)return;q.innerHTML='<h3 class="ch" style="font-size:24px">اختبر معلوماتك</h3>'+Q.map(([t,o,c,e],i)=>{const a=QA[id+i];return`<div class="row" style="display:block"><b>${i+1}. ${t}</b><div>${o.map((x,k)=>`<button class="btn${a===k?(k===c?' good':' bad'):' alt'}" onclick="ans('${id}',${i},${k})">${x}</button>`).join('')}</div>${a===undefined?'':`<p>${a===c?'<span class="ok">✔ صحيح.</span>':'<span class="hot">✘ الصحيح: '+o[c]+'.</span>'} ${e}</p>`}</div>`}).join('')}
function ans(id,i,k){QA[id+i]=k;renderQ(id)}

 $('#ctls').innerHTML=m.ctl.length?m.ctl.map(c=>c.t=='s'?`<div class="ctl"><label>${c.l}</label><select data-k="${c.k}">${c.o.map(o=>`<option value="${o[1]}"${o[1]==c.v?' selected':''}>${o[0]}</option>`).join('')}</select></div>`:`<div class="ctl"><label>${c.l}<output id="o_${c.k}">${c.v}</output></label><input type="range" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.v}"></div>`).join(''):'<p>نشاط نقاشي: اضغط على العناوين لإظهار الإجابات.</p>';
